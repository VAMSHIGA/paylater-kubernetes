apiVersion: apps/v1
kind: Deployment

metadata:
  name: paylater-api-gateway
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.gateway.replicas }}

  selector:
    matchLabels:
      app: paylater-api-gateway

  template:
    metadata:
      labels:
        app: paylater-api-gateway

    spec:
      containers:
        - name: paylater-api-gateway

          image: "{{ .Values.gateway.image }}:{{ .Values.gateway.tag }}"
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy | default "IfNotPresent" }}

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "{{ .Values.gateway.resources.requests.cpu }}"
              memory: "{{ .Values.gateway.resources.requests.memory }}"

            limits:
              cpu: "{{ .Values.gateway.resources.limits.cpu }}"
              memory: "{{ .Values.gateway.resources.limits.memory }}"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          envFrom:
            - configMapRef:
                name: gateway-config

            - secretRef:
                name: gateway-secret
