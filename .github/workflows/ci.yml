name: CI

on:
  push:
  pull_request:

env:
  GO_VERSION: "1.25.1"
  NODE_VERSION: "22"

jobs:
  backend-unit:
    name: Backend unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - identity-service
          - customer-service
          - merchant-service
          - transaction-service
          - payback-service
          - reporting-service
          - .
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            shared/go.sum
            identity-service/go.sum
            customer-service/go.sum
            merchant-service/go.sum
            transaction-service/go.sum
            payback-service/go.sum
            reporting-service/go.sum
            go.sum

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

  backend-integration:
    name: Backend MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      INTEGRATION_TEST_MYSQL_HOST: 127.0.0.1
      INTEGRATION_TEST_MYSQL_PORT: "3306"
      INTEGRATION_TEST_MYSQL_PASSWORD: ci_test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Transaction integration tests
        working-directory: transaction-service
        run: go test -tags=integration ./internal/repository -count=1

      - name: Payback integration tests
        working-directory: payback-service
        run: go test -tags=integration ./internal/repository -count=1

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paylater-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: paylater-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q
        env:
          MYSQL_ROOT_PASSWORD: ci_dummy_mysql_password
          JWT_SECRET: ci_dummy_jwt_secret

  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate OpenAPI specification
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml --extends minimal

  helm-kubernetes:
    name: Helm Kubernetes validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint paylater-chart/

      - name: Render Helm templates
        run: helm template paylater paylater-chart/ -n paylater-dev > /dev/null
