version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting PayLater CodeBuild..."
      - echo "Checking Docker..."
      - docker --version

  build:
    commands:
      - echo "Building PayLater Docker images..."

      - docker build -t paylater-api-gateway .

      - docker build -t paylater-frontend ./paylater-frontend

      - docker build -t paylater-identity-service -f identity-service/Dockerfile .

      - docker build -t paylater-customer-service -f customer-service/Dockerfile .

      - docker build -t paylater-merchant-service -f merchant-service/Dockerfile .

      - docker build -t paylater-transaction-service -f transaction-service/Dockerfile .

      - docker build -t paylater-payback-service -f payback-service/Dockerfile .

      - docker build -t paylater-reporting-service -f reporting-service/Dockerfile .

  post_build:
    commands:
      - echo "PayLater Docker images built successfully."
      - docker images
