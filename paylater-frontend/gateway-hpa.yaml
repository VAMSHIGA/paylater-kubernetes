apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: paylater-api-gateway-hpa
  namespace: paylater-dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paylater-api-gateway

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
