apiVersion: v1
kind: Namespace

metadata:
  name: paylater-dev

---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: paylater-developer
  namespace: paylater-dev


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: paylater-developer-role
  namespace: paylater-dev

rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: paylater-developer-binding
  namespace: paylater-dev

subjects:
  - kind: ServiceAccount
    name: paylater-developer
    namespace: paylater-dev

roleRef:
  kind: Role
  name: paylater-developer-role
  apiGroup: rbac.authorization.k8s.io
